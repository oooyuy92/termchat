name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o termchat${EXT} .

      - name: Package (Unix)
        if: matrix.goos != 'windows'
        run: tar -czf termchat_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz termchat

      - name: Package (Windows)
        if: matrix.goos == 'windows'
        run: zip termchat_${{ matrix.goos }}_${{ matrix.goarch }}.zip termchat.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termchat_${{ matrix.goos }}_${{ matrix.goarch }}
          path: termchat_*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: termchat_*
          generate_release_notes: true
