# config.example.yaml
api:
  base_url: "https://api.openai.com/v1"
  api_key: "your-api-key-here"
  model: "gpt-4o"

parameters:
  temperature: 0.7
  max_tokens: 4096
  # reasoning_effort: ""  # minimal, low, medium, high, or empty

storage:
  dir: "~/.local/share/termchat/conversations"

settings:
  theme: "dark"  # dark or light
